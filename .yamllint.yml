extends: default
rules:
  line-length:
    max: 160
    level: warning
  document-start: disable
  truthy:
    allowed-values:
      - "true"
      - "false"
      - "on"
      - "off"
    check-keys: false
ignore: |
  build/
  build-lint/
  .venv-lint/
  .claude/
  decomp/
  libultraship/
  torch/
  workspace/
  yamls/
  node_modules/
