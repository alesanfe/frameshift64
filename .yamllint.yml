extends: default
rules:
  line-length:
    max: 160
    level: warning
  document-start: disable
  colons:
    max-spaces-after: -1
  truthy:
    allowed-values:
      - "true"
      - "false"
      - "on"
      - "off"
    check-keys: false
ignore: |
  build/
  build-lint/
  out/
  .venv-lint/
  .claude/
  components/decomp/
  components/libultraship/
  components/game-runtime/
  mods/
  assets/game/
  node_modules/
