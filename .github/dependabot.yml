version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/netplay-lobby
    schedule:
      interval: weekly
    groups:
      wrangler:
        patterns: ["wrangler*"]

  - package-ecosystem: gradle
    directory: /platforms/android
    schedule:
      interval: weekly

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    # decomp/libultraship/torch pin to forks — manual bumps via worktree flow.
    open-pull-requests-limit: 0
