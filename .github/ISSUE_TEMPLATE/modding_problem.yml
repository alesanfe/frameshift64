name: Modding problem
description: Writing or loading a mod — SDK, hooks, manifest issues
labels: ["type:bug", "area:mods"]
body:
  - type: input
    id: version
    attributes:
      label: Game version + mod API version
      placeholder: v1.4.1 / apiVersion 1
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: manifest.json
      render: json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What fails
      placeholder: Load state shown by ModRegistry, hook not firing, compile error…
    validations:
      required: true
