name: Determinism & Netplay

# Behavioral tests for the rollback netcode. NOT per-PR: they need the game
# binary plus BattleShip.o2r, which is extracted from baserom.us.z64 — a ROM
# that can never be committed. The suite runs only when the repo defines a
# BASEROM_US_Z64 secret (base64 of the user's legally-owned ROM); without it
# every step skips cleanly.
#
#   SyncTest   — snapshot/resimulate self-check each tick (R3)
#   Localtest  — two instances on loopback UDP, deterministic fuzz inputs,
#                confirmed-state trace diff (R1/R2/R4/R5)
#   Mutants    — each knob removes one validation; the run MUST fail (§21)
#   PacketFuzz — seeded hostile datagrams through the real parser (§11)
#   CrossBuild — Release vs Debug must produce identical traces
#
# Runs nightly + on demand. To enable: add a repository secret named
# BASEROM_US_Z64 containing the base64 of baserom.us.z64.

on:
  schedule:
    - cron: '12 3 * * *'
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      golden_runs:
        description: "Repeat count for the golden-scale run (default: GOLDEN_SCALE_RUNS repo var, else 10)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # ROM-free slice of the suite: builds + runs the CTest harness (netpacket
  # protocol fuzz, menu structure) on every PR — the parts that need no
  # extracted assets. The ROM-gated jobs below still need BASEROM_US_Z64.
  no-rom:
    name: Protocol determinism (no ROM)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build zip clang \
            libsdl2-dev libzip-dev libglew-dev \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            python3 python3-pil imagemagick file
          sudo touch /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
          sudo chmod +x /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
      - name: Use clang as the C/C++ compiler
        run: |
          echo "CC=clang"    >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DNON_PORTABLE=ON -DSSB64_BUILD_TESTING=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: CTest (protocol + structure)
        run: ctest --test-dir build --output-on-failure

  rollback:
    name: Rollback suite (Windows)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BASEROM_B64: ${{ secrets.BASEROM_US_Z64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.BASEROM_B64 != ''
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Skip notice
        if: env.BASEROM_B64 == ''
        run: echo "BASEROM_US_Z64 secret not set — determinism suite skipped."
      - name: Decode baserom
        if: env.BASEROM_B64 != ''
        run: |
          [IO.File]::WriteAllBytes("$PWD\baserom.us.z64", [Convert]::FromBase64String($env:BASEROM_B64))
          $env:BASEROM_B64 = ''
        shell: pwsh
      - name: Install build deps
        if: env.BASEROM_B64 != ''
        run: |
          choco install ninja -y
          python -m pip install --upgrade pip
          python -m pip install Pillow
        shell: pwsh
      - name: Configure + build Release + extract assets
        if: env.BASEROM_B64 != ''
        run: |
          cmake -B build "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
          cmake --build build --config Release -j 4
          cmake --build build --config Release --target ExtractAssets -j 4
        shell: pwsh

      # ── R3: snapshot ↔ resimulate integrity, worst cases included ──────
      - name: SyncTest (distance 1)
        if: env.BASEROM_B64 != ''
        run: ./scripts/development/rollback_synctest.ps1 -BuildDir build/Release -Distance 1 -Minutes 2
        shell: pwsh
      - name: SyncTest (distance 3)
        if: env.BASEROM_B64 != ''
        run: ./scripts/development/rollback_synctest.ps1 -BuildDir build/Release -Distance 3 -Minutes 2
        shell: pwsh
      - name: Rollback stress (distance 6)
        if: env.BASEROM_B64 != ''
        run: ./scripts/development/rollback_synctest.ps1 -BuildDir build/Release -Distance 6 -Minutes 2
        shell: pwsh

      # ── R1/R2/R4/R5: two peers on loopback, confirmed-trace diff ───────
      - name: Netplay local test — clean net (P0)
        if: env.BASEROM_B64 != ''
        run: ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 60
        shell: pwsh
      - name: Netplay local test — degraded net matrix (P1–P8)
        if: env.BASEROM_B64 != ''
        run: |
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 60 `
            -LatencyMs 50 -JitterMs 10 -OutDir out/logs/netplay-matrix/p1
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 60 `
            -LatencyMs 100 -JitterMs 25 -LossPct 3 -DupPct 2 -ReorderPct 5 -OutDir out/logs/netplay-matrix/p2
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 60 `
            -LatencyMs 150 -JitterMs 50 -LossPct 5 -DupPct 5 -ReorderPct 15 -CorruptPct 2 -OutDir out/logs/netplay-matrix/p3
          # Torture profile: 250 ms / 20% loss / heavy jitter + dup — the
          # worst link the rollback layer is expected to survive without a
          # crash or an unchecked desync (desync detection itself is fine).
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 60 `
            -LatencyMs 250 -JitterMs 75 -LossPct 20 -DupPct 5 -ReorderPct 20 -CorruptPct 3 `
            -OutDir out/logs/netplay-matrix/p4
          # Extreme profiles — beyond playable, these bound the envelope:
          # satellite-class latency, quarter/half packet loss, and WAN-grade
          # jitter. Not "is it fun" but "does it stay correct".
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 60 `
            -LatencyMs 500 -JitterMs 100 -LossPct 10 -DupPct 5 -ReorderPct 25 `
            -OutDir out/logs/netplay-matrix/p5
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 60 `
            -LatencyMs 1000 -JitterMs 100 -LossPct 15 -DupPct 5 -ReorderPct 25 `
            -OutDir out/logs/netplay-matrix/p6
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 60 `
            -LatencyMs 100 -JitterMs 100 -LossPct 25 -DupPct 10 -ReorderPct 30 `
            -OutDir out/logs/netplay-matrix/p7
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 60 `
            -LatencyMs 100 -JitterMs 50 -LossPct 50 -DupPct 10 -ReorderPct 30 -CorruptPct 5 `
            -OutDir out/logs/netplay-matrix/p8
        shell: pwsh
      - name: Desync/rollback metrics per profile
        if: env.BASEROM_B64 != ''
        run: |
          foreach ($p in @('p1','p2','p3','p4','p5','p6','p7','p8')) {
            python tools/analysis/netplay_metrics.py --dir "out/logs/netplay-matrix/$p" `
              --out "out/logs/netplay-matrix/$p/metrics.json" `
              --history out/logs/metrics-history.jsonl --label $p
          }
          python tools/analysis/netplay_metrics.py --dir out/logs/netplay-test `
            --out out/logs/netplay-test/metrics.json `
            --history out/logs/metrics-history.jsonl --label sync-test
        shell: pwsh

      # ── T3: golden gameplay — fixed input tapes vs committed state traces ──
      # Each case replays a committed .ssr and diffs every tick's state hash
      # against tests/support/golden/*.trace. A DESYNC here means the sim is
      # no longer bit-identical to the recorded baseline.
      - name: Golden gameplay cases
        if: env.BASEROM_B64 != ''
        run: python tests/e2e/golden/golden_gameplay_test.py --build-dir build/Release --timeout 300
        shell: pwsh

      # ── Mass validation (nightly/dispatch only) ───────────────────────
      # Re-verify every golden case N times. The replay is fixed, so a pass
      # per run proves the sim is insensitive to process-level nondeterminism
      # (ASLR, thread scheduling, allocator layout). Skipped on PRs to keep
      # the gated run bounded; scale = dispatch input > repo var > 10.
      - name: Golden gameplay scale run (nightly)
        if: env.BASEROM_B64 != '' && github.event_name != 'pull_request'
        run: |
          $runs = "${{ github.event.inputs.golden_runs }}"
          if (-not $runs) { $runs = "${{ vars.GOLDEN_SCALE_RUNS }}" }
          if (-not $runs) { $runs = "10" }
          Write-Output "golden scale: --repeat $runs"
          python tests/e2e/golden/golden_gameplay_test.py --build-dir build/Release `
            --timeout 300 --repeat $runs --output out/test-results/golden-scale
          if ($LASTEXITCODE -ne 0) { Write-Error "golden scale run failed"; exit 1 }
        shell: pwsh
      - name: Golden scale metrics
        if: env.BASEROM_B64 != '' && github.event_name != 'pull_request'
        run: |
          python tools/analysis/netplay_metrics.py --dir out/test-results/golden-scale `
            --history out/logs/metrics-history.jsonl --label golden-scale
        shell: pwsh

      # ── §11: packet parser fuzz — must not crash; desync is expected ───
      - name: Packet fuzz through real handlers
        if: env.BASEROM_B64 != ''
        run: |
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -Seconds 45 -PacketFuzz 600
          if ($LASTEXITCODE -ne 0) { Write-Error "packet fuzz crashed or produced no trace (exit $LASTEXITCODE)"; exit 1 }
        shell: pwsh

      # ── §21: mutation suite — every mutant must be caught ──────────────
      - name: Mutation suite
        if: env.BASEROM_B64 != ''
        run: ./scripts/testing/netplay_mutation_suite.ps1 -BuildDir build/Release -Minutes 1 -Seconds 45
        shell: pwsh

      # ── TD-010: manifest/replay/json parsers — mutations must not crash ──
      - name: Parser fuzz (manifest/replay/json)
        if: env.BASEROM_B64 != ''
        run: |
          foreach ($p in @('manifest','replay','json','save')) {
            python tools/analysis/fuzz/run_parser_fuzz.py --parser $p --binary build/Release/BattleShip.exe --iters 300 --timeout 15
            if ($LASTEXITCODE -ne 0) { Write-Error "parser fuzz ($p) found crashes"; exit 1 }
          }
        shell: pwsh

      - name: Upload traces + logs + metrics
        if: env.BASEROM_B64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: determinism-traces
          path: |
            out/logs/netplay-test/
            out/logs/netplay-matrix/
            out/logs/metrics-history.jsonl
          retention-days: 30
          if-no-files-found: ignore

  cross-build:
    name: Cross-build determinism (Release vs Debug)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BASEROM_B64: ${{ secrets.BASEROM_US_Z64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.BASEROM_B64 != ''
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Skip notice
        if: env.BASEROM_B64 == ''
        run: echo "BASEROM_US_Z64 secret not set — cross-build check skipped."
      - name: Decode baserom
        if: env.BASEROM_B64 != ''
        run: |
          [IO.File]::WriteAllBytes("$PWD\baserom.us.z64", [Convert]::FromBase64String($env:BASEROM_B64))
          $env:BASEROM_B64 = ''
        shell: pwsh
      - name: Install build deps
        if: env.BASEROM_B64 != ''
        run: |
          choco install ninja -y
          python -m pip install --upgrade pip
          python -m pip install Pillow
        shell: pwsh
      - name: Build Release + Debug
        if: env.BASEROM_B64 != ''
        run: |
          cmake -B build "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
          cmake --build build --config Release -j 4
          cmake --build build --config Debug -j 4
          cmake --build build --config Release --target ExtractAssets -j 4
          cmake --build build --config Debug --target ExtractAssets -j 4
        shell: pwsh
      # Same seed + same sim seed on both builds → the confirmed traces must
      # be byte-identical (trace lines are tick hashes, portable across
      # build configs — a divergence means the sim depends on build mode).
      - name: Trace compare Release vs Debug
        if: env.BASEROM_B64 != ''
        run: |
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Release -OutDir out/logs/xb-rel -Seconds 60 -Seed 777
          if ($LASTEXITCODE -ne 0) { Write-Error "Release run not in sync"; exit 1 }
          ./scripts/testing/netplay_localtest.ps1 -BuildDir build/Debug -OutDir out/logs/xb-dbg -Seconds 60 -Seed 777
          if ($LASTEXITCODE -ne 0) { Write-Error "Debug run not in sync"; exit 1 }
          $rel = Get-Content out/logs/xb-rel/host.trace
          $dbg = Get-Content out/logs/xb-dbg/host.trace
          if (-not $rel -or -not $dbg) { Write-Error "missing trace"; exit 1 }
          $n = [Math]::Min($rel.Count, $dbg.Count)
          if ($rel.Count -ne $dbg.Count) { Write-Output "warn: trace length differs rel=$($rel.Count) dbg=$($dbg.Count)" }
          for ($i = 0; $i -lt $n; $i++) {
            if ($rel[$i] -ne $dbg[$i]) {
              Write-Error "cross-build divergence at trace line $i`n  rel: $($rel[$i])`n  dbg: $($dbg[$i])"
              exit 1
            }
          }
          Write-Output "CROSS-BUILD IDENTICAL for $n ticks"
        shell: pwsh
      - name: Upload cross-build traces
        if: env.BASEROM_B64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: crossbuild-traces
          path: |
            out/logs/xb-rel/
            out/logs/xb-dbg/
          retention-days: 30
          if-no-files-found: ignore

  # ── Cross-platform determinism ──────────────────────────────────────────
  # One Windows host records a real netplay match (seeded fuzz inputs) into
  # a .ssr replay + a per-tick state-hash sync trace. Every other platform
  # then replays that same input tape and must reproduce the trace
  # byte-for-byte — that is "Android behaves exactly like Windows" made
  # executable. The replay+trace pair is the only artifact that crosses
  # runners; no ROM-derived data is uploaded.
  oracle:
    name: Replay oracle (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BASEROM_B64: ${{ secrets.BASEROM_US_Z64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.BASEROM_B64 != ''
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Skip notice
        if: env.BASEROM_B64 == ''
        run: echo "BASEROM_US_Z64 secret not set — cross-platform suite skipped."
      - name: Decode baserom
        if: env.BASEROM_B64 != ''
        run: |
          [IO.File]::WriteAllBytes("$PWD\baserom.us.z64", [Convert]::FromBase64String($env:BASEROM_B64))
          $env:BASEROM_B64 = ''
        shell: pwsh
      - name: Install build deps
        if: env.BASEROM_B64 != ''
        run: |
          choco install ninja -y
          python -m pip install --upgrade pip
          python -m pip install Pillow
        shell: pwsh
      - name: Configure + build Release + extract assets
        if: env.BASEROM_B64 != ''
        run: |
          cmake -B build "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
          cmake --build build --config Release -j 4
          cmake --build build --config Release --target ExtractAssets -j 4
        shell: pwsh
      - name: Record oracle (2-player netplay, seeded fuzz, 900 frames)
        if: env.BASEROM_B64 != ''
        run: |
          python tests/e2e/netplay/localtest_test.py --build-dir build/Release `
            --seconds 60 --seed 777 --replay-frames 900 --sync-trace `
            --out-dir out/logs/xplat-oracle
          if ($LASTEXITCODE -ne 0) { Write-Error "oracle run failed"; exit 1 }
          if (-not (Test-Path out/logs/xplat-oracle/host.sync.trace)) { Write-Error "no oracle trace"; exit 1 }
          if (-not (Get-ChildItem out/logs/xplat-oracle/replays/*.ssr -ErrorAction SilentlyContinue)) { Write-Error "no replay recorded"; exit 1 }
        shell: pwsh
      - name: Upload oracle (replay + golden trace)
        if: env.BASEROM_B64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: xplat-oracle
          path: |
            out/logs/xplat-oracle/replays/*.ssr
            out/logs/xplat-oracle/host.sync.trace
          retention-days: 30
          if-no-files-found: error

  xplat-verify:
    name: Platform verify (${{ matrix.name }})
    needs: oracle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            bin: build/Release/BattleShip.exe
          - name: Linux
            os: ubuntu-22.04
            bin: build/BattleShip
          - name: macOS
            os: macos-14
            bin: build/BattleShip
    env:
      BASEROM_B64: ${{ secrets.BASEROM_US_Z64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.BASEROM_B64 != ''
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Skip notice
        if: env.BASEROM_B64 == ''
        run: echo "BASEROM_US_Z64 secret not set — platform verify skipped."
      - name: Decode baserom (Linux/macOS)
        if: env.BASEROM_B64 != '' && runner.os != 'Windows'
        run: echo "$BASEROM_B64" | base64 -d > baserom.us.z64
        shell: bash
      - name: Decode baserom (Windows)
        if: env.BASEROM_B64 != '' && runner.os == 'Windows'
        run: |
          [IO.File]::WriteAllBytes("$PWD\baserom.us.z64", [Convert]::FromBase64String($env:BASEROM_B64))
          $env:BASEROM_B64 = ''
        shell: pwsh
      - name: Install build deps (Linux)
        if: env.BASEROM_B64 != '' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build zip clang \
            libsdl2-dev libzip-dev libglew-dev \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            python3 python3-pil imagemagick file
          sudo touch /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
          sudo chmod +x /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
          echo "CC=clang"    >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Install build deps (macOS)
        if: env.BASEROM_B64 != '' && runner.os == 'macOS'
        run: |
          brew install cmake ninja sdl2 glew libzip nlohmann-json tinyxml2 spdlog
          python3 -m pip install --break-system-packages Pillow
      - name: Install build deps (Windows)
        if: env.BASEROM_B64 != '' && runner.os == 'Windows'
        run: |
          choco install ninja -y
          python -m pip install --upgrade pip
          python -m pip install Pillow
        shell: pwsh
      - name: Download oracle
        if: env.BASEROM_B64 != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: xplat-oracle
          path: out/xplat-oracle
      - name: Build Release + extract assets (Linux/macOS)
        if: env.BASEROM_B64 != '' && runner.os != 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DNON_PORTABLE=ON
          cmake --build build -j 4
          cmake --build build --target ExtractAssets -j 4
      - name: Build Release + extract assets (Windows)
        if: env.BASEROM_B64 != '' && runner.os == 'Windows'
        run: |
          cmake -B build "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
          cmake --build build --config Release -j 4
          cmake --build build --config Release --target ExtractAssets -j 4
        shell: pwsh
      - name: Replay + verify against Windows oracle
        if: env.BASEROM_B64 != ''
        run: |
          python tools/developer/testing/replay_platform_verify.py \
            --binary "${{ matrix.bin }}" \
            --replay out/xplat-oracle \
            --oracle-trace out/xplat-oracle/host.sync.trace \
            --work-dir out/xplat/${{ matrix.name }}
      - name: Upload platform trace
        if: env.BASEROM_B64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: xplat-${{ matrix.name }}
          path: out/xplat/${{ matrix.name }}/
          retention-days: 30
          if-no-files-found: ignore

  android-verify:
    name: Platform verify (Android emulator)
    needs: oracle
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BASEROM_B64: ${{ secrets.BASEROM_US_Z64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.BASEROM_B64 != ''
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Skip notice
        if: env.BASEROM_B64 == ''
        run: echo "BASEROM_US_Z64 secret not set — Android verify skipped."
      - name: Decode baserom
        if: env.BASEROM_B64 != ''
        run: echo "$BASEROM_B64" | base64 -d > baserom.us.z64
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        if: env.BASEROM_B64 != ''
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build deps
        if: env.BASEROM_B64 != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build zip clang \
            libsdl2-dev libzip-dev libglew-dev \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            python3 python3-pil imagemagick file
          sudo touch /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
          sudo chmod +x /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
      - name: Produce f3d.o2r + extract BattleShip.o2r on host
        if: env.BASEROM_B64 != ''
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DNON_PORTABLE=ON
          cmake --build build --target GenerateF3DO2R ExtractAssets -j"$(nproc)"
      - name: NDK (pinned by gradle)
        if: env.BASEROM_B64 != ''
        run: |
          echo "y" | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;29.0.14206865" || true
      - name: assembleDebug (x86_64 for the emulator)
        if: env.BASEROM_B64 != ''
        working-directory: platforms/android
        run: ./gradlew assembleDebug --no-daemon -Pssb64.abis=x86_64
      - name: Download oracle
        if: env.BASEROM_B64 != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: xplat-oracle
          path: out/xplat-oracle
      - name: Enable KVM
        if: env.BASEROM_B64 != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run replay on Android emulator + verify
        if: env.BASEROM_B64 != ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 33
          arch: x86_64
          disable-animations: true
          script: |
            python tools/developer/testing/android_replay_verify.py \
              --apk platforms/android/app/build/outputs/apk/debug/app-debug.apk \
              --o2r build/extracted/BattleShip.o2r \
              --replay out/xplat-oracle \
              --oracle-trace out/xplat-oracle/host.sync.trace \
              --work-dir out/xplat/android
      - name: Upload Android trace + log
        if: env.BASEROM_B64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: xplat-Android
          path: out/xplat/android/
          retention-days: 30
          if-no-files-found: ignore
