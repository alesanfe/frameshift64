name: Dependency review

# TD-013: blocks PRs that introduce dependencies with known vulnerabilities
# (catches what `npm audit` on the lockfile misses — a new dep can carry a
# vulnerable transitive tree). Diff-only by design: existing deps are audited
# separately.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3 # v4.8.0
        with:
          fail-on-severity: high
