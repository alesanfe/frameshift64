name: Android

# assembleDebug on every PR — catches changes that break the Android port
# (AGP config, JNI signatures, minSdk CMake paths) before they reach main.
#
# The APK needs f3d.o2r + config.yml + yamls/ staged by the desktop CMake
# build first (see android/app/build.gradle.kts `stageGameAssets`; BattleShip.o2r
# is produced on-device from the user's ROM, so nothing ROM-derived ships).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (assembleDebug)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build zip clang \
            libsdl2-dev libzip-dev libglew-dev \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            python3 python3-pil imagemagick file
          sudo touch /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
          sudo chmod +x /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
      - name: Produce f3d.o2r (shader pack, no ROM needed)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DNON_PORTABLE=ON
          cmake --build build --target GenerateF3DO2R -j"$(nproc)"
      - name: NDK (pinned by gradle)
        run: |
          echo "y" | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;29.0.14206865" || true
      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battleship-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
