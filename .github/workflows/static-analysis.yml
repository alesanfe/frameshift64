name: Static Analysis

# Two tiers:
#
#   fast-lints — codespell, yamllint, ruff, bandit, lizard, cpplint,
#     cmake-lint and the repo's own semgrep rules. No build needed.
#
#   clang-tidy / cppcheck — run against a real compile_commands.json produced
#     by the same configure as the Linux CI build. Needs the full dep set.
#
# BASELINE PHASE: every tool's output is collected as an artifact and the
# check stays green while the existing backlog is triaged. Flip a tool to
# blocking by removing its `continue-on-error` / adding `--error-exitcode`
# once its report is clean. See docs/audit_static_analysis_2026-10-14.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'   # nightly, full sweep included

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-lints:
    name: Fast lints (no build)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cpplint cmakelang lizard codespell yamllint ruff bandit semgrep
      - name: Run fast lints
        run: |
          mkdir -p out/reports/lint
          codespell . --config .codespellrc > out/reports/lint/codespell.txt 2>&1 || true
          yamllint -c .yamllint.yml . > out/reports/lint/yamllint.txt 2>&1 || true
          ruff check . --exclude .venv-lint --exclude build --exclude out/build/lint \
            --exclude decomp --exclude libultraship --exclude torch \
            --output-format full > out/reports/lint/ruff.txt 2>&1 || true
          bandit -r scripts tools -x '*/tests/*,*/build/*' \
            > out/reports/lint/bandit.txt 2>&1 || true
          lizard -l cpp -C 15 -L 120 -a 6 -w \
            src include platforms tools \
            > out/reports/lint/lizard.txt 2>&1 || true
          cpplint --recursive --extensions=c,cc,cpp,cxx,h,hh,hpp,hxx \
            --filter=-whitespace/line_length,-build/include_subdir \
            --exclude=build --exclude=out/build/lint --exclude=decomp \
            --exclude=libultraship --exclude=torch --exclude=mods \
            src include platforms tools \
            > out/reports/lint/cpplint.txt 2>&1 || true
          find . \( -name CMakeLists.txt -o -name '*.cmake' \) \
            -not -path './build*' -not -path './decomp/*' \
            -not -path './libultraship/*' -not -path './torch/*' \
            -print0 | xargs -0 cmake-lint > out/reports/lint/cmake-lint.txt 2>&1 || true
          semgrep scan --config config/analysis/semgrep/smash-classic.yml \
            src include platforms tools scripts decomp/src/sys \
            > out/reports/lint/semgrep-smash.txt 2>&1 || true
      - name: Summarize findings
        run: |
          {
            echo "## Static analysis (fast tier)"
            echo ""
            for f in out/reports/lint/*.txt; do
              echo "- $(basename "$f"): $(wc -l < "$f") lines"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lint-reports-fast
          path: out/reports/lint/
          retention-days: 14

  clang-tidy:
    name: clang-tidy (compile DB)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build zip clang \
            libsdl2-dev libzip-dev libglew-dev \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            python3 python3-pil imagemagick file
          sudo touch /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
          sudo chmod +x /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
          python -m pip install clang-tidy cppcheck
      - name: Configure (compile_commands.json only)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B out/build/lint -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNON_PORTABLE=ON
      - name: clang-tidy (own code)
        run: |
          run-clang-tidy -p out/build/lint -config-file .clang-tidy -j "$(nproc)" \
            'smash-classic.(src|include|platforms|tools|services|mods|tests).' \
            > out/reports/lint/clang-tidy.txt 2>&1 || true
      - name: cppcheck (own code)
        run: |
          cppcheck --project=out/build/lint/compile_commands.json \
            --enable=warning,performance,portability,style \
            --inconclusive --inline-suppr --std=c++20 \
            --suppressions-list=config/analysis/static/cppcheck-suppressions.txt \
            -i decomp -i libultraship -i torch -i out/build/lint/_deps \
            > out/reports/lint/cppcheck.txt 2>&1 || true
      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lint-reports-db
          path: out/reports/lint/
          retention-days: 14
