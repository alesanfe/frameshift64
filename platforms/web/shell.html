<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BattleShip</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #0b0e13; color: #cfd8e3;
               font: 14px/1.4 system-ui, sans-serif; height: 100%; }
  #stage { display: flex; flex-direction: column; align-items: center;
           justify-content: center; min-height: 100%; gap: 12px; }
  canvas.emscripten { border: 1px solid #26303c; background: #000;
                      max-width: 100vw; max-height: 80vh; }
  #status { white-space: pre-wrap; color: #8fa3b8; }
  #picker { display: none; }
  button { background: #1d2733; color: #cfd8e3; border: 1px solid #3a4a5c;
           padding: 8px 16px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #263444; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas class="emscripten" id="canvas" width="960" height="540"
          oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading…</div>
  <button id="romButton" class="hidden">Choose extracted assets (BattleShip.o2r)</button>
  <input id="picker" type="file" accept=".o2r">
</div>
<script>
/* Web loader for the Emscripten build.
 *
 * Flow: the wasm module is created with noInitialRun so we can stage the
 * filesystem before main():
 *   1. mount IDBFS at /persist (survives reloads), sync-in,
 *   2. copy /persist/BattleShip.o2r → MEMFS cwd if present, else try a
 *      same-origin fetch, else show the file picker,
 *   3. callMain() once BattleShip.o2r exists in MEMFS.
 *
 * Saves: LUS writes config/save files relative to the app dir (MEMFS cwd).
 * A syncfs-out hook flushes MEMFS→IDBFS on pagehide so progress persists.
 */
var statusEl = document.getElementById('status');
var picker = document.getElementById('picker');
var romButton = document.getElementById('romButton');
var O2R = 'BattleShip.o2r';
var PERSIST = '/persist';
var started = false;

function setStatus(t) { statusEl.textContent = t; }

var Module = {
  canvas: document.getElementById('canvas'),
  noInitialRun: true,
  print: function (t) { console.log(t); },
  printErr: function (t) { console.warn(t); },
  setStatus: setStatus,
  onAbort: function (what) { setStatus('Crashed: ' + what); },
};

async function stageFsAndStart(Module) {
  const FS = Module.FS;
  try {
    FS.mkdir(PERSIST);
    FS.mount(FS.filesystems.IDBFS, {}, PERSIST);
    await new Promise((res, rej) =>
      FS.syncfs(true, e => (e ? rej(e) : res())));
  } catch (e) {
    console.warn('IDBFS unavailable (private mode?), saves stay in-memory', e);
  }

  if (!FS.analyzePath(O2R).exists && FS.analyzePath(PERSIST + '/' + O2R).exists) {
    setStatus('Restoring assets from browser storage…');
    FS.writeFile(O2R, FS.readFile(PERSIST + '/' + O2R));
  }

  if (!FS.analyzePath(O2R).exists) {
    try {
      setStatus('Fetching ' + O2R + '…');
      const r = await fetch(O2R);
      if (r.ok) FS.writeFile(O2R, new Uint8Array(await r.arrayBuffer()));
    } catch (e) { /* fall through to the picker */ }
  }

  if (!FS.analyzePath(O2R).exists) {
    setStatus('No extracted assets found.\n' +
              'Extract BattleShip.o2r on desktop (first-run wizard) once,\n' +
              'then pick it here — it is cached in this browser afterwards.');
    romButton.classList.remove('hidden');
    await new Promise(res => {
      romButton.onclick = () => picker.click();
      picker.onchange = () => {
        const f = picker.files[0];
        if (!f) return;
        setStatus('Loading ' + f.name + '…');
        const rd = new FileReader();
        rd.onload = () => {
          const bytes = new Uint8Array(rd.result);
          FS.writeFile(O2R, bytes);
          try {
            FS.writeFile(PERSIST + '/' + O2R, bytes);
            FS.syncfs(false, () => {});
          } catch (e) { /* persist is best-effort */ }
          res();
        };
        rd.readAsArrayBuffer(f);
      };
    });
    romButton.classList.add('hidden');
  }

  window.addEventListener('pagehide', () => {
    try { FS.syncfs(false, () => {}); } catch (e) {}
  });

  setStatus('Starting…');
  started = true;
  Module.callMain();
}

BattleShipModule(Module).then(stageFsAndStart).catch(e => {
  setStatus('Failed to load wasm: ' + e);
});
</script>
{{{ SCRIPT }}}
</body>
</html>
