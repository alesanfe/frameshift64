# Network impairment profiles for netplay e2e/soak runs.
# Values map 1:1 onto SSB64_NETPLAY_SIM_* env vars consumed by
# src/netplay/transport/udp_transport.cpp — see docs/development/env_vars.md.
# Usage: pass --profile <name> to e2e drivers (session_runner.load_profile)
# or set the env vars manually. `seed` fixes the PRNG for reproducibility;
# omit it for a different sequence each run.

profiles:
  clean:
    latency_ms: 0
    jitter_ms: 0
    loss_pct: 0
    dup_pct: 0
    reorder_pct: 0
    corrupt_pct: 0

  residential:
    latency_ms: 45
    jitter_ms: 12
    loss_pct: 0.5
    dup_pct: 0.2
    reorder_pct: 0.5
    corrupt_pct: 0
    seed: 1337

  degraded:
    latency_ms: 120
    jitter_ms: 35
    loss_pct: 3
    dup_pct: 1
    reorder_pct: 1
    reorder_window_ms: 60
    corrupt_pct: 0.1
    seed: 1337

  # Worst case that should still converge — for nightly soak, not PR.
  hostile:
    latency_ms: 200
    jitter_ms: 60
    loss_pct: 8
    dup_pct: 2
    reorder_pct: 3
    reorder_window_ms: 120
    corrupt_pct: 0.5
    seed: 1337
